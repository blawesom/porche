<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORCHE — 401</title>
<style>
  :root { font-family: system-ui, sans-serif; color-scheme: light dark;
    --fg: #1c2128; --muted: #57606a; --border: #d0d7de; --surface: #ffffff; --accent: #0a5fd0; --error: #cf222e; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --muted:#8b949e; --border:#30363d; --surface:#0d1117; --accent:#58a6ff; --error:#f85149; } }
  body { background: var(--surface); color: var(--fg); max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  form label { display: block; margin: .9rem 0 .25rem; font-size: .9rem; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: .4rem;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--fg); }
  button { margin-top: 1rem; padding: .45rem 1.2rem; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 5px;
    background: var(--accent); color: var(--surface); }
  .banner { border: 1px solid var(--error); color: var(--error);
    padding: .55rem .85rem; border-radius: 5px; margin-bottom: 1.2rem; }
  .subtle { color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
<h1>PORCHE — {{ surface }} surface</h1>
<div class="banner"><strong>401 — authentication required.</strong> This surface takes its own token; the token never opens the other surface.</div>
<form method="get" action="{{ surface_home }}">
  <label>{{ surface }} token</label>
  <input type="password" name="token" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
<p class="subtle">The token can also be presented as <code>Authorization: Bearer &lt;token&gt;</code>, or appended as <code>?token=</code> to any page URL (sets the <code>porche_token</code> cookie, then redirects clean).</p>
</body>
</html>
